name: SipDock checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install 'coverage>=7,<8' 'PyYAML>=6,<7'
      - run: python tools/check.py
      - name: Check Compose and the break-glass shell
        run: |
          SIPDOCK_CONFIG=./tests/lab.yaml docker compose config --quiet
          cid=$(docker run -d --network none --entrypoint python3 sipdock:local -c 'import time; time.sleep(300)')
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          bash debug.sh --container "$cid" --command '[[ $(id -un) == kamailio ]] && ip addr show lo'
      - name: Verify README badges match these results
        run: git diff --exit-code -- docs/badges/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sipdock-checks
          path: |
            reports/*.xml
            reports/*.json
            docs/badges/*.svg
