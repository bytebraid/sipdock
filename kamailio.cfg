#!KAMAILIO
# Startup generates the constants from the operator's YAML.
include_file "/run/sipdock/settings.cfg"

debug=2
log_stderror=yes
children=2
max_branches=MAX_CLIENTS
tcp_children=1
tcp_accept_no_cl=yes
tcp_connection_lifetime=10
auto_aliases=no
pv_buffer_size=32768
listen=udp:0.0.0.0:5060 advertise ADVERTISED_HOST:5060
listen=udp:[::]:5060 advertise ADVERTISED_HOST:5060
listen=tcp:0.0.0.0:8080
listen=tcp:[::]:8080
listen=tcp:0.0.0.0:8081
listen=tcp:[::]:8081
alias=ADVERTISED_HOST:5060
#!ifdef PHONE_MTLS
enable_tls=yes
tcp_no_connect=yes
tcp_accept_aliases=no
listen=tls:0.0.0.0:5061 advertise ADVERTISED_HOST:5061
listen=tls:[::]:5061 advertise ADVERTISED_HOST:5061
alias=ADVERTISED_HOST:5061
loadmodule "tls.so"
modparam("tls", "config", "/run/sipdock/tls.cfg")
#!endif

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "kex.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "siputils.so"
loadmodule "textops.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "nathelper.so"
loadmodule "ipops.so"
loadmodule "db_sqlite.so"
loadmodule "uac.so"
loadmodule "tcpops.so"
loadmodule "xhttp.so"

modparam("auth", "qop", "auth")
modparam("auth", "nonce_count", 1)
modparam("sanity", "autodrop", 0)
modparam("registrar", "max_contacts", MAX_CLIENTS)
modparam("registrar", "max_expires", 600)
modparam("registrar", "append_branches", 1)
modparam("registrar|nathelper", "received_avp", "$avp(received)")
modparam("nathelper", "natping_interval", 25)
modparam("nathelper", "sipping_bflag", 6)
modparam("nathelper", "sipping_from", LINE_AOR)
modparam("registrar", "use_path", 0)
#!ifdef PHONE_MTLS
modparam("usrloc", "handle_lost_tcp", 1)
#!endif
modparam("uac", "restore_mode", "none")
modparam("uac", "reg_db_url", "sqlite:///run/sipdock/line.sqlite")
modparam("uac", "reg_contact_addr", ADVERTISED_SOCKET)
modparam("uac", "reg_timer_interval", 5)
modparam("uac", "reg_retry_interval", 30)
modparam("uac", "reg_keep_callid", 1)

request_route {
#!ifdef PHONE_MTLS
    # UDP is solely the provider leg, including in-dialog requests.
    # Even the provider and loopback cannot register a phone over UDP.
    if (proto != TLS) {
        if (proto != UDP) { exit; }
        if (is_method("REGISTER") || !is_in_subnet("$si", TRUSTED_SOURCES)) {
            if (REG_DEBUG) { xlog("L_INFO", "sipdock reject method=$rm source=$si:$sp reason=client-certificate-required\n"); }
            if (!is_method("ACK")) { sl_send_reply("403", "Client TLS certificate required"); }
            exit;
        }
    }
#!else
    if (proto != UDP) { exit; }
#!endif
    if (REG_DEBUG) {
        xlog("L_INFO", "sipdock receive method=$rm source=$si:$sp transport=$proto cseq=$cs\n");
    }
    force_rport();
    if (!sanity_check("17895", "7")) {
        if (REG_DEBUG) { xlog("L_INFO", "sipdock reject method=$rm source=$si:$sp reason=malformed-sip\n"); }
        exit;
    }
    if (!maxfwd_process("16")) {
        if (REG_DEBUG) { xlog("L_INFO", "sipdock reject method=$rm source=$si:$sp status=483 reason=hop-limit\n"); }
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (is_method("REGISTER")) {
        route(REGISTER_PHONE);
        exit;
    }

    $var(provider) = 0;
    if (proto == UDP && is_in_subnet("$si", TRUSTED_SOURCES)) {
        $var(provider) = 1;
#!ifdef PHONE_MTLS
    } else if (!reg_from_user("location", LINE_AOR, "3")) {
#!else
    } else if (!reg_from_user("location", LINE_AOR, "1")) {
#!endif
        if (REG_DEBUG) { xlog("L_INFO", "sipdock reject method=$rm source=$si:$sp reason=unregistered-source\n"); }
        if (!is_method("ACK")) { sl_send_reply("403", "Registration required"); }
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }
    if (!is_method("ACK")) { t_check_trans(); }

    if (has_totag()) {
        if (loose_route()) {
            if ($var(provider)) {
                handle_ruri_alias();
                t_on_reply("PHONE");
            } else {
                $du = UPSTREAM_URI;
                if (is_present_hf("Contact")) { set_contact_alias("1"); }
            }
            route(RELAY);
        } else if (is_method("ACK")) {
            if (t_check_trans()) { t_relay(); }
        } else {
            sl_send_reply("481", "Dialog does not exist");
        }
        exit;
    }

    # A phone may preload a Route to its configured outbound proxy.
    remove_hf("Route");
    if (is_method("INVITE|SUBSCRIBE|REFER")) { record_route(); }
    if ($var(provider)) {
        if (is_method("OPTIONS")) {
            sl_send_reply("200", "OK");
            exit;
        }
        if ($rU != LINE_USER) {
            sl_send_reply("404", "Unknown line");
            exit;
        }
        if (!lookup("location", LINE_AOR)) {
            sl_send_reply("480", "No registered phones");
            exit;
        }
        t_on_reply("PHONE");
    } else {
        # Preserve the Request-URI, SDP and any provider digest response.
        $du = UPSTREAM_URI;
        if (is_present_hf("Contact")) { set_contact_alias("1"); }
    }
    route(RELAY);
}

route[REGISTER_PHONE] {
    if (REG_DEBUG) {
        # Bound and escape handset-supplied fields. Never dump SIP packets,
        # Authorization headers, digest responses or the configured password.
        xlog("L_INFO", "sipdock REGISTER attempt source=$si:$sp cseq=$cs line=$(tU{s.substr,0,64}{s.escape.param}) domain=$(td{s.substr,0,128}{s.escape.param}) agent=$(ua{s.substr,0,120}{s.rmhlws}{s.escape.param})\n");
    }
    # A retransmitted REGISTER reuses the cached response.
    if (!t_newtran()) { exit; }
    if ($tU != LINE_USER) {
        if (REG_DEBUG) { xlog("L_INFO", "sipdock REGISTER rejected source=$si:$sp status=403 reason=unknown-line check=User-Name\n"); }
        t_reply("403", "Unknown line");
        exit;
    }
    $var(auth_result) = pv_www_authenticate("sipdock", LOCAL_HA1, "1");
    if ($var(auth_result) < 1 || $au != AUTH_USER) {
        if (REG_DEBUG) {
            if (!is_present_hf("Authorization")) {
                $var(reason) = "initial-challenge";
            } else if ($ar != "sipdock") {
                $var(reason) = "wrong-or-missing-realm";
            } else if ($au != AUTH_USER) {
                $var(reason) = "auth-user-mismatch";
            } else if ($var(auth_result) == -2) {
                $var(reason) = "digest-mismatch";
            } else if ($var(auth_result) == -4) {
                $var(reason) = "nonce-expired";
            } else if ($var(auth_result) == -6) {
                $var(reason) = "nonce-reused";
            } else {
                $var(reason) = "invalid-credentials";
            }
            xlog("L_INFO", "sipdock REGISTER challenge source=$si:$sp cseq=$cs status=401 reason=$var(reason) auth_code=$var(auth_result) auth_user=$(au{s.substr,0,64}{s.escape.param}) realm=$(ar{s.substr,0,64}{s.escape.param})\n");
        }
        www_challenge("sipdock", "1");
        exit;
    }
    fix_nated_register();
#!ifdef PHONE_MTLS
    # All phone traffic uses the existing, authenticated TLS connection.
    # Keep it alive beyond the registrar's maximum lease of 600 seconds.
    tcp_set_connection_lifetime("660");
#!else
    setbflag(6);
#!endif
    $var(saved) = save("location");
    if (REG_DEBUG) {
        if ($var(saved) < 0) {
            $var(reason) = "registrar-error";
            if ($var(saved) == -2) { $var(reason) = "contact-limit"; }
            xlog("L_INFO", "sipdock REGISTER rejected source=$si:$sp status=$T_reply_code reason=$var(reason) registrar_code=$var(saved)\n");
        } else {
            switch ($var(saved)) {
                case 2: $var(action) = "refresh"; break;
                case 3: $var(action) = "remove"; break;
                case 4: $var(action) = "query"; break;
                default: $var(action) = "save";
            }
            xlog("L_INFO", "sipdock REGISTER accepted source=$si:$sp cseq=$cs status=200 action=$var(action)\n");
        }
    }
}

# The upstream UAC registers separately from every local phone.
event_route[tm:local-request] {
    if (REG_DEBUG && is_method("REGISTER")) {
        xlog("L_INFO", "sipdock upstream REGISTER sent target=$du cseq=$cs\n");
    }
}

reply_route {
    if (REG_DEBUG && is_method("REGISTER")) {
        xlog("L_INFO", "sipdock upstream REGISTER reply source=$si:$sp status=$rs cseq=$cs\n");
    }
}

event_route[tm:local-response] {
    if (REG_DEBUG && is_method("REGISTER") && is_present_hf("P-Registrar-Error")) {
        xlog("L_INFO", "sipdock REGISTER registrar detail cseq=$cs status=$rs reason=$(hdr(P-Registrar-Error){s.rmhlws}{s.escape.param})\n");
    }
}

route[RELAY] {
    if (!t_relay()) { sl_reply_error(); }
    exit;
}

onreply_route[PHONE] {
    if (is_present_hf("Contact") && status =~ "[12][0-9][0-9]") {
        set_contact_alias("1");
    }
}

event_route[xhttp:request] {
    set_reply_close();
    if (proto != TCP) { exit; }
    if ($Rp == 8081 && $hu == "/registrations" && $rm == "GET") {
        route(REGISTRATIONS_PAGE);
        exit;
    }
    if ($Rp != 8080 || $hu != "/healthz" || $rm != "GET") {
        xhttp_reply("404", "Not Found", "text/plain", "unknown endpoint\n");
        exit;
    }
    if (uac_reg_status(LINE_USER)) {
        xhttp_reply("200", "OK", "text/plain", "registered\n");
    } else {
        xhttp_reply("503", "Service Unavailable", "text/plain", "upstream unregistered\n");
    }
}

route[REGISTRATIONS_PAGE] {
    $var(limit) = MAX_CLIENTS;
    $var(line) = LINE_AOR;
    $var(upstream_state) = "Unregistered";
    if (uac_reg_status(LINE_USER)) { $var(upstream_state) = "Registered"; }
    $var(rows) = "";
    $var(active) = 0;
    $var(i) = 0;
    $var(now) = $TS;
    if (reg_fetch_contacts("location", LINE_AOR, "report")) {
        while ($var(i) < $ulc(report=>count)) {
            $var(ttl) = $(ulc(report=>expires)[$var(i)]) - $var(now);
            if ($var(ttl) > 0) {
                $var(agent) = $(ulc(report=>user_agent)[$var(i)]);
                if ($var(agent) == "") { $var(agent) = "Unknown device"; }
                # Interpolate only into HTML text nodes. Use the contact's
                # host and port so URI credentials and parameters stay private.
                $var(agent) = $(var(agent){s.substr,0,120}{s.replace,&,&amp;}{s.replace,<,&lt;}{s.replace,>,&gt;});
                $var(contact) = $(ulc(report=>addr)[$var(i)]);
                $var(host) = $(var(contact){uri.host}{s.replace,&,&amp;}{s.replace,<,&lt;}{s.replace,>,&gt;});
                $var(port) = $(var(contact){uri.port});
                if ($var(port) == "") { $var(port) = "5060"; }
                $var(received) = $(ulc(report=>received)[$var(i)]);
                $var(source) = $(var(received){uri.host}) + ":" + $(var(received){uri.port});
                $var(rows) = $var(rows) + "<tr><td>" + $var(agent) + "</td><td class='endpoint'>" + $var(host) + ":" + $var(port) + "</td><td class='endpoint'>" + $var(source) + "</td><td>" + $var(ttl) + " s</td></tr>";
                $var(active) = $var(active) + 1;
            }
            $var(i) = $var(i) + 1;
        }
    }
    reg_free_contacts("report");
    if ($var(active) == 0) {
        $var(rows) = "<tr><td colspan='4'>No phones are currently registered.</td></tr>";
    }
    append_to_reply("Cache-Control: no-store\r\n");
    xhttp_reply("200", "OK", "text/html; charset=utf-8", REPORT_TEMPLATE);
}
